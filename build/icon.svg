<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img"><title>elecxstock</title>
  <!-- elec シリーズの構成: 明るいグレーの板に暗いタイル、左下に白縁の青い丸と白い 3 本線の「E」（§10.1） -->
  <defs>
    <clipPath id="t1"><rect x="208" y="128" width="640" height="420" rx="22"/></clipPath>
  </defs>
  <rect x="172" y="88" width="740" height="860" rx="64" fill="#94a3b8"/>
  <rect x="160" y="76" width="740" height="860" rx="64" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="8"/>
  <!-- チャートのタイル: ローソク足（陽線 赤・陰線 青緑、日本式）と移動平均 -->
  <rect x="208" y="128" width="640" height="420" rx="22" fill="#0b0f14" stroke="#a7c8cc" stroke-width="10"/>
  <g clip-path="url(#t1)">
    <rect x="240" y="152" width="70" height="12" rx="6" fill="#a7c8cc"/>
    <g stroke-width="8" stroke-linecap="round">
      <line x1="290" y1="300" x2="290" y2="440" stroke="#2f9bd6"/><rect x="272" y="320" width="36" height="90" rx="4" fill="#2f9bd6"/>
      <line x1="360" y1="290" x2="360" y2="420" stroke="#e5484d"/><rect x="342" y="310" width="36" height="80" rx="4" fill="#e5484d"/>
      <line x1="430" y1="250" x2="430" y2="380" stroke="#e5484d"/><rect x="412" y="270" width="36" height="80" rx="4" fill="#e5484d"/>
      <line x1="500" y1="270" x2="500" y2="390" stroke="#2f9bd6"/><rect x="482" y="290" width="36" height="70" rx="4" fill="#2f9bd6"/>
      <line x1="570" y1="220" x2="570" y2="350" stroke="#e5484d"/><rect x="552" y="240" width="36" height="80" rx="4" fill="#e5484d"/>
      <line x1="640" y1="190" x2="640" y2="310" stroke="#e5484d"/><rect x="622" y="210" width="36" height="72" rx="4" fill="#e5484d"/>
      <line x1="710" y1="200" x2="710" y2="300" stroke="#2f9bd6"/><rect x="692" y="215" width="36" height="55" rx="4" fill="#2f9bd6"/>
      <line x1="780" y1="160" x2="780" y2="270" stroke="#e5484d"/><rect x="762" y="178" width="36" height="66" rx="4" fill="#e5484d"/>
    </g>
    <polyline points="250,420 330,390 400,350 470,330 540,300 610,262 690,240 820,200" fill="none" stroke="#c98500" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#3d4756">
      <rect x="272" y="482" width="36" height="46"/><rect x="342" y="470" width="36" height="58"/><rect x="412" y="490" width="36" height="38"/><rect x="482" y="460" width="36" height="68"/>
      <rect x="552" y="478" width="36" height="50"/><rect x="622" y="452" width="36" height="76"/><rect x="692" y="486" width="36" height="42"/><rect x="762" y="466" width="36" height="62"/>
    </g>
  </g>
  <!-- 銘柄の一覧のタイル -->
  <rect x="508" y="588" width="340" height="300" rx="22" fill="#0b0f14" stroke="#a7c8cc" stroke-width="10"/>
  <rect x="540" y="614" width="60" height="12" rx="6" fill="#a7c8cc"/>
  <g stroke-linecap="round" stroke-width="22">
    <line x1="546" y1="672" x2="700" y2="672" stroke="#94a3b8"/><line x1="742" y1="672" x2="812" y2="672" stroke="#e5484d"/>
    <line x1="546" y1="736" x2="680" y2="736" stroke="#64748b"/><line x1="742" y1="736" x2="812" y2="736" stroke="#2f9bd6"/>
    <line x1="546" y1="800" x2="712" y2="800" stroke="#475569"/><line x1="742" y1="800" x2="812" y2="800" stroke="#e5484d"/>
  </g>
  <rect x="208" y="588" width="260" height="300" rx="22" fill="#0b0f14" stroke="#a7c8cc" stroke-width="10"/>
  <!-- 「E」のバッジ -->
  <circle cx="272" cy="720" r="224" fill="#ffffff"/>
  <circle cx="272" cy="720" r="192" fill="#10a5e8"/>
  <g stroke="#ffffff" stroke-width="48" stroke-linecap="round">
    <line x1="176" y1="624" x2="368" y2="624"/>
    <line x1="176" y1="720" x2="304" y2="720"/>
    <line x1="176" y1="816" x2="368" y2="816"/>
  </g>
</svg>
