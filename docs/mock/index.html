<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>elecxstock — UI mock</title>
<!-- モック専用: フォントは Google Fonts から読む（アプリでは同梱する。FR-V7） -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="mock.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand"><span class="logo">E</span><span class="name">elecxstock</span></div>
    <nav id="layouts" aria-label="layouts"></nav>
    <button id="cmd" class="cmd" type="button"><span class="cmd-icon">›</span><span id="cmd-ph"></span><kbd>Ctrl+K</kbd></button>
    <div class="top-right">
      <button id="reset" class="chip" type="button" title="Ctrl+Alt+R"></button>
      <span id="market-state" class="pill"></span>
      <span id="clock" class="mono"></span>
    </div>
  </header>
  <main id="workspace"></main>
  <footer id="statusbar"></footer>
</div>
<div id="overlay-root"></div>
<script src="lightweight-charts.standalone.production.js"></script>
<script src="mock-data.js"></script>
<script src="mock.js"></script>
</body>
</html>
