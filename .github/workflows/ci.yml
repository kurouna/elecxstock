# プッシュとプルリクエストのたびに lint・型検査・単体テスト・ビルド・E2E を実行する（NFR-CI1）。
# 待ち時間を減らすため、単体（lint・型・単体・要求の網羅・カバレッジ）と、ビルド・E2E・パッケージを別のジョブで並べて回す（docs/testing.md）
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit tests with coverage (floor per folder)
        run: npm run coverage
      - name: Requirement IDs vs tests
        run: npm run trace
  e2e:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # 同梱 OSS のライセンス（ビルドが作る out/THIRD_PARTY_NOTICES.txt を読む。NFR-CI4）
      - run: node scripts/check-licenses.mjs
      # 実際のカーソルを画面の右下の角へ（窓は画面の中央に出るので、カーソルが窓の上にあるとチャートの十字線・
      # 資産推移の十字線の日がカーソルに引っぱられ、キーだけの操作の結果がずれる。テストの仕組みのマウスでは OS のカーソルは動かない）
      - name: Park the real mouse cursor
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          [System.Windows.Forms.Cursor]::Position = [System.Drawing.Point]::new($b.Right - 1, $b.Bottom - 1)
          [System.Windows.Forms.Cursor]::Position
      - name: E2E (stub provider, fixed clock, keyboard only)
        run: npx playwright test
      - name: Package and smoke-test the installer build
        run: |
          npx electron-builder --win --dir --publish never
          node scripts/packaged-smoke.mjs release/win-unpacked/elecxstock.exe
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results
          path: test-results/
