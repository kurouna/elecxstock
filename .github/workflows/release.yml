# タグ（v*）を打つと Windows のインストーラを作り、GitHub Releases に公開する（NFR-CI2）
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node scripts/check-licenses.mjs
      - run: npx playwright test
      # electron-builder の並列アップロードは同じタグのリリースを 2 つ作ることがある（v0.0.1 で発生）。
      # インストーラを作ってから、gh で 1 つのリリースにまとめて載せる
      - name: Build the installer
        run: npx electron-builder --win --publish never
      - name: Publish the release
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" --title "${GITHUB_REF_NAME#v}" --generate-notes \
            release/*-setup.exe release/*-setup.exe.blockmap release/latest.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
